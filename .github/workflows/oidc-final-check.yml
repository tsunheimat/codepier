name: OIDC final isolated verification
on:
  push:
    branches: [build/oidc-final-hardening-20260925]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Publish exact hash-verified source changes to feature branch only
        id: publish
        env:
          EXPECTED: 2ee049f6f17f065cfe1e90ba90a9ecd710364c04
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/multiuser-oidc | cut -f1)" = "$EXPECTED"
          TARGET="$RUNNER_TEMP/source"
          export TARGET
          git worktree add --detach "$TARGET" "$EXPECTED"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['TARGET']);patch=Path('_transfer/final.patch').resolve()
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='4720dbd32a4c234411f1ed82e6a75964c32fd70398be3e5c6ea9a79aaa4940c3'
          manifest=json.loads(Path('_transfer/manifest.json').read_text())
          for path,hashes in manifest.items():
              current=root/path
              actual=hashlib.sha256(current.read_bytes()).hexdigest() if current.exists() else None
              assert actual==hashes['before'],path
          subprocess.run(['git','apply','--check',str(patch)],cwd=root,check=True)
          subprocess.run(['git','apply',str(patch)],cwd=root,check=True)
          for path,hashes in manifest.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==hashes['after'],path
          subprocess.run(['git','add','--',*manifest],cwd=root,check=True)
          PY
          git -C "$TARGET" diff --cached --check
          git -C "$TARGET" -c user.name='CodePier automation' -c user.email='codepier-automation@users.noreply.github.com' commit -m 'fix(iam): fence owner restoration and stale OIDC links; diagnose real provider login'
          SHA=$(git -C "$TARGET" rev-parse HEAD)
          git -C "$TARGET" push origin HEAD:refs/heads/feat/multiuser-oidc
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source: $SHA" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned tools and Chromium
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt -r requirements-tools.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Source and focused regression checks
        run: |
          mkdir -p dist
          .venv/bin/python -m ruff check agent hub shared scripts tests
          .venv/bin/python -m pytest -q tests/test_iam_final_regressions.py tests/test_oidc_integration.py tests/test_iam_hardening.py tests/test_iam_integration.py tests/test_audit_store.py --junitxml=dist/oidc-final-focused.xml
      - name: Actual Authentik browser acceptance
        run: .venv/bin/python scripts/check_oidc_authentik.py --output dist/authentik-acceptance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: oidc-final-verification-${{ github.run_id }}
          path: |
            dist/oidc-final-focused.xml
            dist/authentik-acceptance.json
          if-no-files-found: warn
          retention-days: 14
