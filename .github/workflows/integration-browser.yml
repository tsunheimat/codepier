name: Pinned integration browser tooling
on:
  push:
    branches: [build/integration-browser-20260927]
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Fetch reviewed browser version for local, disposable tests
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install chromium webkit
          tar -czf browsers.tar.gz browsers
          sha256sum browsers.tar.gz > browsers.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codepier-integration-browsers
          compression-level: 0
          path: |
            browsers.tar.gz
            browsers.tar.gz.sha256
          retention-days: 3
