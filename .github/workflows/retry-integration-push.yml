name: Retry exact integration publication

on:
  push:
    branches: [build/retry-integration-push-20260928]

permissions:
  contents: write

concurrency:
  group: retry-exact-integration-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish the checksum-verified original integration commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: python3 .push-delivery/publish.py
