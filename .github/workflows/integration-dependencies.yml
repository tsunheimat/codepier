name: Integration dependency inputs
on:
  push:
    branches: [build/integration-source-20260927]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cyeinfpro/codepier
          ref: 84e24d53b33ca24e3d54609f65df8c14c347f29e
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download published pinned wheels only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheels"
          python -m pip download --only-binary=:all: -r requirements-dev.txt -r requirements-tools.txt --dest "$RUNNER_TEMP/wheels"
          python -m pip download --only-binary=:all: --no-deps 'PyJWT==2.13.0' --dest "$RUNNER_TEMP/wheels"
          cd "$RUNNER_TEMP/wheels"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codepier-integration-wheels
          path: ${{ runner.temp }}/wheels/
          retention-days: 7
          if-no-files-found: error
