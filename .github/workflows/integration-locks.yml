name: Reviewed IAM dependency locks
on:
  push:
    branches: [build/integration-snapshot-20260927]
permissions:
  contents: read
jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cyeinfpro/codepier
          ref: 84e24d53b33ca24e3d54609f65df8c14c347f29e
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Resolve exact additional PyJWT pin with the repository lock generator
        run: |
          python -m pip install 'uv==0.10.8'
          printf '\n# Multi-user OIDC signature verification.\nPyJWT[crypto]==2.13.0\n' >> requirements.in
          python scripts/lock_requirements.py --exclude-newer 2026-09-27
          mkdir -p locks/wheels
          cp requirements*.in requirements*.txt locks/
          python -m pip download --only-binary=:all: --require-hashes -r requirements-dev.txt -d locks/wheels
          (cd locks && find wheels -type f -print0 | sort -z | xargs -0 sha256sum > wheels.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codepier-reviewed-iam-locks
          path: locks/
          retention-days: 7
